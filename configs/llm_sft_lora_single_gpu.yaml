## SFT with LoRA on one small GPU (fits a 6 GB card).
## Loss is computed on the assistant turns only (algorithm.completion_only).
## Dataset shapes accepted: messages | prompt+completion | instruction(+input)+output | text.
model_name: Qwen/Qwen2.5-0.5B-Instruct
model_type: llm

dataset:
  name: trl-lib/Capybara        ## multi-turn chat, `messages` column
  split: train[:2000]

algorithm:
  type: sft
  completion_only: true         ## false = also train on the prompt/user tokens

training:
  epochs: 1
  batch_size: 2
  max_length: 512               ## longer conversations are cut at the end
  learning_rate: 2e-4
  gradient_checkpointing: true
  warmup_steps: 20
  lr_scheduler: cosine
  weight_decay: 0.0
  grad_clip: 1.0

strategy: solo    ## solo | ddp | fsdp (post-training does not support 5d yet)
num_gpus: 1
checkpoint_dir: checkpoints
save: true

dist_parameters:
  mixed_precision: true         ## bf16 autocast, fp32 weights
  param_dtype: bfloat16
  reduce_dtype: float32
  output_dtype: bfloat16
  cast_forward_inputs: false
  distribute_api: dcp_api

save_load:
  resume: false
  resume_path: ""
  load_model_from_hf: true

prefetch:
  explicit: false
  forward: 1
  backward: 1

peft:
  enabled: true
  type: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

quantization:                   ## set enabled: true + peft.type: qlora for QLoRA (solo/ddp only)
  enabled: false
  bits: 4
  quant_type: nf4
  compute_dtype: bfloat16
  double_quant: true

wandb:
  wandb_log_with_train: false
  wandb_entity: ""
  wandb_project: "omni-train"
  wandb_run_name: ""
