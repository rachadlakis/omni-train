## GRPO with LoRA on one small GPU: grade-school math with verifiable rewards.
## Measured on a 6 GB RTX 4050: 3.8 GB allocated, 5.5 GB reserved, so 6 GB is tight once the desktop
## takes its share. Lower num_generations or batch_size if it runs out of memory.
## Every step samples num_generations answers per prompt, scores them with the reward
## functions and pushes the policy towards the answers that beat their group's average.
## No reward model, no value model, no second copy of the weights (the KL reference is the
## same model with its LoRA adapters disabled).
##   CONFIG_PATH=configs/llm_grpo_lora_single_gpu.yaml bash scripts/launch.sh
## Watch `reward` climb in the progress line (the console charts it); the GRPO loss itself
## stays near 0 because advantages average to zero within each group.
model_name: Qwen/Qwen2.5-0.5B-Instruct
model_type: llm

dataset:
  name: openai/gsm8k            ## question + answer ("... #### 72"): the accuracy reward reads the number after ####
  subset: main
  split: train[:1000]

algorithm:
  type: grpo
  num_generations: 4            ## group size G: completions per prompt (>= 2)
  max_prompt_length: 192        ## prompts are cut from the left
  max_completion_length: 320    ## tokens generated per completion (step-by-step solutions run ~150-250)
  temperature: 1.0
  top_p: 1.0
  beta: 0.04                    ## KL to the start model (needs LoRA); 0 = no KL, like DAPO / Dr. GRPO
  epsilon: 0.2
  epsilon_high: 0.28            ## DAPO clip-higher keeps exploration alive
  loss_type: dapo               ## grpo | dapo | dr_grpo
  scale_rewards: true           ## false = Dr. GRPO advantages (no division by the group std)
  rewards:                      ## built-in: accuracy | format | exact_match | contains | length, or "module:function"
    accuracy: 1.0               ## reads \boxed{...}, <answer>...</answer>, "#### x" or the last number
  ## Qwen's own math prompt. Small models told to "only give the number" stop reasoning and
  ## get it wrong; `format` (<think>/<answer> tags) suits models trained for that format.
  system_prompt: Please reason step by step, and put your final answer within \boxed{}.

training:
  epochs: 1
  batch_size: 2                 ## PROMPTS per GPU per step: each step trains on batch_size x num_generations completions
  max_length: 512               ## >= max_prompt_length + max_completion_length
  learning_rate: 2e-5           ## GRPO likes small steps: LoRA ~1e-5 to 5e-5, full fine-tune ~1e-6
  gradient_checkpointing: true
  warmup_steps: 10
  lr_scheduler: constant
  weight_decay: 0.0
  grad_clip: 1.0

strategy: solo    ## solo | ddp | fsdp (FSDP: generation runs with synced_gpus; not 5d)
num_gpus: 1
checkpoint_dir: checkpoints
save: true

dist_parameters:
  mixed_precision: true         ## bf16 autocast, fp32 weights
  param_dtype: bfloat16
  reduce_dtype: float32
  output_dtype: bfloat16
  cast_forward_inputs: false
  distribute_api: dcp_api

save_load:
  resume: false
  resume_path: ""
  load_model_from_hf: true

prefetch:
  explicit: false
  forward: 1
  backward: 1

peft:
  enabled: true
  type: lora
  r: 16
  alpha: 32
  dropout: 0.0                  ## dropout is switched off for GRPO anyway (log-probs must match sampling)
  target_modules: all-linear
  bias: none

quantization:                   ## enabled: true + peft.type: qlora for QLoRA (solo/ddp only)
  enabled: false
  bits: 4
  quant_type: nf4
  compute_dtype: bfloat16
  double_quant: true

wandb:
  wandb_log_with_train: false
  wandb_entity: ""
  wandb_project: "omni-train"
  wandb_run_name: ""
