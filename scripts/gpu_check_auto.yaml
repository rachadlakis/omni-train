# strategy: auto on real GPUs (scripts/gpu_check.sh): the advisor measures the model, the data and
# the GPUs, picks solo / ddp / fsdp / 5d and the GPU count, then launch.sh runs it. Small and public:
# facebook/opt-125m on 1% of wikitext, one epoch, nothing saved.
model_name: facebook/opt-125m
model_type: llm
dataset: {name: wikitext, subset: wikitext-2-raw-v1, split: "train[:1%]"}
strategy: auto
num_gpus: auto
checkpoint_dir: gpu_check_logs/auto_ckpt
save: false
training: {epochs: 1, batch_size: 2, max_length: 128, learning_rate: 0.0001, gradient_checkpointing: false,
  warmup_steps: 0, lr_scheduler: constant, weight_decay: 0.0, grad_clip: 1.0}
dist_parameters: {mixed_precision: false, param_dtype: float32, reduce_dtype: float32, output_dtype: float32,
  cast_forward_inputs: false, distribute_api: dcp_api}
save_load: {resume: false, resume_path: '', load_model_from_hf: true}
peft: {enabled: false, type: lora, r: 8, alpha: 16, dropout: 0.0, target_modules: all-linear, bias: none}
quantization: {enabled: false, bits: 4, quant_type: nf4, compute_dtype: bfloat16, double_quant: false}
prefetch: {explicit: false, forward: 1, backward: 1}
wandb: {wandb_log_with_train: false, wandb_entity: '', wandb_project: omni-train}
